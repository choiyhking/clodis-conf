# Collect conference dates every morning and redeploy the site.
#  - push to main : deploy code changes
#  - schedule     : 06:00 KST daily — collect dates, commit what changed, deploy
#  - manual       : Actions tab → Run workflow
name: update-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Dates are collected on the daily schedule and on manual runs only. Code pushes just build and
      # deploy, so a data commit never races with the next push.
      - name: Collect conference dates
        if: github.event_name != 'push'
        run: npm run update-data
        continue-on-error: true

      - name: Commit collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/auto.json
          git diff --cached --quiet && exit 0
          git commit -m "data: collect conference dates $(date -u +%F)"
          # Someone may have pushed while this ran: replay our commit on top, and never fail the
          # deploy over it — tomorrow's run will commit the data again.
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "::warning::Could not push collected data; will retry on the next run"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
